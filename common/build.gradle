plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    addModdingDependenciesTo sourceSets.test
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    testImplementation "org.mockito:mockito-core:5.24.0"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes.attribute(loaderAttribute, 'common')
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes.attribute(loaderAttribute, 'common')
        }
    }
}

tasks.register('verifyQuestApi', JavaExec) {
    group = 'verification'
    description = 'Verifies quest API codecs, authoring, persistence, graph validation and HTTP transport.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.veryue.vuequests.editor.api.QuestApiVerification'
    workingDir = layout.projectDirectory
}

tasks.named('check') {
    dependsOn tasks.named('verifyQuestApi')
}

tasks.named('test', Test) {
    // Verification uses the JavaExec task above rather than a JUnit test engine.
    failOnNoDiscoveredTests = false
}
