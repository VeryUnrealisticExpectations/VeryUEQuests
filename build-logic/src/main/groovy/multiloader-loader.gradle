plugins {
    id 'multiloader-common'
}

ext.fancyMenuEnabled = providers.gradleProperty('vuequestsFancyMenu')
        .map { it.toBoolean() }
        .orElse(true)
        .get()

if (fancyMenuEnabled) {
    sourceSets.main.java.srcDir(rootProject.file('common/src/fancymenu/java'))
    repositories {
        maven {
            name = 'CurseMaven'
            url = uri('https://www.cursemaven.com')
            content { includeModule('curse.maven', 'fancymenu-367706') }
        }
    }
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava) {
        include '**/*.java'
    }
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
